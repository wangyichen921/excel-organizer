<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Excel 自动整理工具操作示意</title>
  <desc id="desc">顶部为文件列表，中部选择排序列和顺序，底部点击整理并另存为。</desc>
  <rect width="760" height="500" fill="#f4f6f9"/>
  <rect x="30" y="24" width="700" height="452" rx="10" fill="#ffffff" stroke="#bdc7d3" stroke-width="2"/>
  <rect x="30" y="24" width="700" height="42" rx="10" fill="#e8eef6"/>
  <rect x="30" y="55" width="700" height="11" fill="#e8eef6"/>
  <text x="50" y="51" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#142c48">Excel 自动整理工具</text>
  <text x="52" y="102" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1e3652">1. 选择 Excel 文件</text>
  <rect x="52" y="116" width="656" height="165" rx="3" fill="#ffffff" stroke="#9aa9ba"/>
  <text x="70" y="149" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#4c5f73">订单_一.xlsx</text>
  <text x="70" y="180" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#4c5f73">订单_二.xlsx</text>
  <rect x="52" y="295" width="110" height="36" rx="5" fill="#eaf2ff" stroke="#729bd2"/>
  <text x="73" y="319" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#123f74">添加文件</text>
  <rect x="177" y="295" width="110" height="36" rx="5" fill="#f5f7fa" stroke="#9aa9ba"/>
  <text x="198" y="319" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#334b63">移除选中</text>
  <text x="52" y="365" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#1e3652">2. 排序设置</text>
  <text x="68" y="400" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#334b63">排序列</text>
  <rect x="140" y="374" width="190" height="35" rx="4" fill="#ffffff" stroke="#9aa9ba"/>
  <text x="153" y="397" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#334b63">金额  ▾</text>
  <circle cx="380" cy="392" r="9" fill="#ffffff" stroke="#427bb9" stroke-width="2"/>
  <circle cx="380" cy="392" r="4" fill="#427bb9"/>
  <text x="397" y="398" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#334b63">升序</text>
  <circle cx="483" cy="392" r="9" fill="#ffffff" stroke="#9aa9ba" stroke-width="2"/>
  <text x="500" y="398" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#334b63">降序</text>
  <rect x="52" y="425" width="185" height="35" rx="5" fill="#2369ae"/>
  <text x="68" y="449" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#ffffff">3. 整理并另存为…</text>
</svg>
